[[rules]]
id = "folder_trust"
state = "blocked"
priority = 320
region = "bottom_non_empty_lines(16)"
visible_blocker = true
contains = ["do you trust the files in this folder?", "trust folder"]

[[rules]]
id = "login_required"
msg = "Sign in required"
state = "blocked"
priority = 320
region = "bottom_non_empty_lines(16)"
visible_blocker = true
any = [
  { contains = ["sign in to get started"] },
  { contains = ["how would you like to authenticate"] },
  { contains = ["waiting for authentication..."] },
]

[[rules]]
id = "confirmation_or_input_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["waiting for user confirmation"], any = [{ contains = ["yes"] }, { contains = ["no"] }, { contains = ["allow"] }, { contains = ["reject"] }] },
  { contains = ["awaiting approval"], any = [{ contains = ["allow"] }, { contains = ["reject"] }] },
  { contains = ["permission required"] },
  { contains = ["allow once or always?"] },
  { contains = ["asking user"] },
  { contains = ["enter your response"] },
  { contains = ["review your answers:"] },
  { contains = ["shell awaiting input"] },
]

[[rules]]
id = "cancel_hint_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["(esc to cancel,"]

[[rules]]
id = "spinner_working"
state = "working"
priority = 90
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]\s+.*\p{Alphabetic}']
