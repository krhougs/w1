[[rules]]
id = "permission_dialog"
msg = "Permission required"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(12)"
visible_blocker = true
any = [
  { contains = ["Permission required"] },
  { all = [{ contains = ["Allow"] }, { contains = ["Deny"] }, { contains = ["esc"] }] },
]

# Fullscreen: a dialog above the bottom lines is still the current frame.
[[rules]]
id = "permission_dialog_full"
msg = "Permission required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
contains = ["allow for session", "deny", "enter confirm"]

[[rules]]
id = "question_dialog"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(12)"
visible_blocker = true
contains = ["enter select", "quick select"]

[[rules]]
id = "working_hint"
state = "working"
priority = 200
region = "bottom_non_empty_lines(8)"
visible_working = true
any = [
  { contains = ["esc cancel"] },
  { contains = ["press again to cancel"] },
  { contains = ["esc to cancel"] },
  { contains = ["esc to interrupt"] },
  { line_regex = ['^\s*::: Working'] },
  { line_regex = ['^\s*[\u2801-\u28FF]+\s+\S'] },
]
