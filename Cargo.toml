[package]
name = "w1"
version = "0.1.2"
edition = "2021"
description = "Wrap7501: makes TUI coding agents (Codex, OpenCode, Gemini, Copilot, ...) report status over OSC 7501"
license = "MIT OR Apache-2.0"
repository = "https://github.com/krhougs/w1"
readme = "README.md"
keywords = ["osc7501", "terminal", "pty", "coding-agent", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["AGENTS.md", ".gitignore"]

[dependencies]
alacritty_terminal = "=0.26.0"
base64 = "0.22"
libc = "0.2"
regex = "=1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
