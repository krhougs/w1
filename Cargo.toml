[package]
name = "wrap7501"
version = "0.1.0"
edition = "2021"
description = "OSC 7501 (Program Status Protocol) PTY wrapper for TUI coding agents"

[[bin]]
name = "w1"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "=0.26.0"
base64 = "0.22"
libc = "0.2"
regex = "=1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
